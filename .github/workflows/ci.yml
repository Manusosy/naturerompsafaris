name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          cat > next-env.d.ts << 'EOF'
          /// <reference types="next" />
          /// <reference types="next/image-types/global" />
          EOF
      - run: npm run secret:scan
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          # No real database is reachable in CI, so skip Payload-backed
          # generateStaticParams. Production builds (Vercel) omit this flag and
          # pre-render those routes against the real database.
          SKIP_DB_DURING_BUILD: "true"
          DATABASE_URL: postgresql://user:password@db.neon.tech/neondb?sslmode=require
          PAYLOAD_SECRET: ci-placeholder-secret-with-safe-length
          NEXT_PUBLIC_SITE_URL: https://kenyatanzaniasafariadventures.com
